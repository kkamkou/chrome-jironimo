<div class="container container-options bg-white padding20">

  <navigation current="jql"></navigation>

  <h1>
    Jironimo
    <small>{{ 'optionsJqlWorkspacesTitle' | i18n }}</small>
  </h1>

  <p class="place-right"><i class="icon-info"></i> {{ 'optionsJqlWorkspacesRefreshInterval' | i18n }}</p>

  <div class="span12">
    <div class="button-set">
      <button type="button"
        [ngClass]="{success: accountSelected === 'ALL'}"
        (click)="accountSwitch('ALL')">{{ 'settingsWorkspaceAccountShared' | i18n }}</button>
      <button type="button"
        *ngFor="let account of accounts"
        [ngClass]="{success: accountSelected === account}"
        (click)="accountSwitch(account)">{{ account.label }}</button>
    </div>
  </div>

  <form (ngSubmit)="save()" style="margin-bottom: 0">
    <notify [entries]="notifications"></notify>

    <div class="grid">
      <div class="row" *ngIf="!workspaces.length">
        <div class="span11 offset1 balloon top">
          <p class="padding10">
            Hey! It looks like your list is empty. Click the button below to add a new workspace.
          </p>
        </div>
      </div>

      <div class="row" *ngFor="let workspace of workspaces; let idx = index">

        <div class="span1">
          <i class="icon-{{ workspace.icon }} place-right" style="margin-top: 11px;"></i>
        </div>

        <div class="span10">
          <div class="span2">
            <div class="input-control text">
              <input type="text" [name]="'icon_' + idx" maxlength="18" required
                [title]="'titleOptionsJqlIcon' | i18n"
                [placeholder]="'placeholderOptionsJqlIcon' | i18n"
                [(ngModel)]="workspace.icon">
            </div>
          </div>

          <div class="span7">
            <div class="input-control text">
              <input type="text" [name]="'title_' + idx" maxlength="40" required
                [title]="'placeholderOptionsJqlTitle' | i18n"
                [placeholder]="'placeholderOptionsJqlTitle' | i18n"
                [(ngModel)]="workspace.title">
            </div>
          </div>

          <div class="input-control textarea">
            <textarea [name]="'query_' + idx" required style="min-height: 50px;"
              [title]="'placeholderOptionsJqlQuery' | i18n"
              [placeholder]="'placeholderOptionsJqlQuery' | i18n"
              [(ngModel)]="workspace.query"></textarea>

            <div class="label info"
              *ngIf="workspace.changesNotify && isQueryValidForWatch(workspace.query)">
              <i class="icon-lamp-2 place-left"></i>&nbsp;
              <span [innerHTML]="'optionsJqlDateHint' | i18n"></span>
            </div>
          </div>
        </div>

        <div class="span1 text-center" *ngIf="workspaces.length > 1">
          <button type="button" class="danger" style="margin-top: 5px;"
            (click)="remove(workspace)"><i class="icon-cancel-2"></i></button>
        </div>

        <div class="offset1 span5">
          <div class="input-control checkbox">
            <label>
              <input type="checkbox" [name]="'notify_' + idx" [(ngModel)]="workspace.changesNotify" />
              <span class="check"></span>
              {{ 'optionsJqlCheckUpdates' | i18n }}
            </label>
          </div>
        </div>

        <div class="span5" *ngIf="workspace.changesNotify">
          <div class="input-control checkbox">
            <label>
              <input type="checkbox" [name]="'persistent_' + idx" [(ngModel)]="workspace.changesNotifyPersistent" />
              <span class="check"></span>
              {{ 'optionsJqlCheckUpdatesPersistent' | i18n }}
            </label>
          </div>
        </div>

      </div>
    </div>

    <div class="row">
      <div class="span11 offset1">
        <button (click)="add()" type="button" class="success">
          <i class="icon-plus-2"></i> {{ 'optionsJqlAddOne' | i18n }}
        </button>

        <a href="http://metroui.org.ua/v2/icons.html" class="button link" target="_blank">
          <i class="icon-link"></i>
          {{ 'optionsJqlAvailableIcons' | i18n }}
        </a>
      </div>
    </div>

    <hr>

    <div>
      <input type="submit" [value]="'btnSave' | i18n" class="button default">

      <button type="button" class="primary place-right"
        *ngIf="accountSelected !== 'ALL'"
        (click)="import()" [disabled]="importingFavorites">
        <i class="icon-spin"></i> {{ 'optionsJqlImportFavorites' | i18n }}
      </button>
    </div>
  </form>

</div>
