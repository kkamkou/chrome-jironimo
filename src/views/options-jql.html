<div class="container container-options bg-white padding20">

  <navigation current="jql"></navigation>

  <h1>
    Jironimo
    <small>{{ 'optionsJqlWorkspacesTitle' | i18n }}</small>
  </h1>

  <p class="place-right text-xs text-neutral-600 flex items-center gap-1.5 mt-2">
    <i class="icon-info fg-teal"></i> {{ 'optionsJqlWorkspacesRefreshInterval' | i18n }}
  </p>

  <div class="mb-5">
    <p-buttongroup class="button-set">
      <button pButton type="button"
        [severity]="accountSelected === 'ALL' ? 'success' : 'secondary'"
        [ngClass]="{success: accountSelected === 'ALL'}"
        (click)="accountSwitch('ALL')">{{ 'settingsWorkspaceAccountShared' | i18n }}</button>
      <button pButton type="button"
        *ngFor="let account of accounts"
        [severity]="accountSelected === account ? 'success' : 'secondary'"
        [ngClass]="{success: accountSelected === account}"
        (click)="accountSwitch(account)">{{ account.label }}</button>
    </p-buttongroup>
  </div>

  <form (ngSubmit)="save()" ngNativeValidate class="mb-0">
    <div class="grid">
      <div class="row" *ngIf="!workspaces.length">
        <div class="span11 offset1">
          <p-message severity="info">
            Hey! It looks like your list is empty. Click the button below to add a new workspace.
          </p-message>
        </div>
      </div>

      <div class="row pb-4 border-b border-neutral-100" *ngFor="let workspace of workspaces; let idx = index">

        <div class="span1 flex justify-end">
          <span class="inline-flex items-center justify-center w-8 h-8 bg-neutral-100 border border-neutral-300 text-base">
            <i class="icon-{{ workspace.icon }}"></i>
          </span>
        </div>

        <div class="span9">
          <div class="flex gap-3 mb-2">
            <div class="w-40 shrink-0">
              <div class="input-control text">
                <input pInputText type="text" [name]="'icon_' + idx" maxlength="18" required
                  [title]="'titleOptionsJqlIcon' | i18n"
                  [placeholder]="'placeholderOptionsJqlIcon' | i18n"
                  [(ngModel)]="workspace.icon"
                  fluid>
              </div>
            </div>

            <div class="flex-1">
              <div class="input-control text">
                <input pInputText type="text" [name]="'title_' + idx" maxlength="40" required
                  [title]="'placeholderOptionsJqlTitle' | i18n"
                  [placeholder]="'placeholderOptionsJqlTitle' | i18n"
                  [(ngModel)]="workspace.title"
                  fluid>
              </div>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-1.5 mb-2" *ngIf="focusedWorkspace === workspace">
            <p-tag
              *ngFor="let iconName of iconSuggestions"
              severity="secondary"
              class="cursor-pointer select-none"
              (click)="selectIcon(iconName)">
              <i class="icon-{{ iconName }} mr-1"></i> {{ iconName }}
            </p-tag>
          </div>

          <div class="input-control textarea">
            <div class="flex items-stretch">
              <textarea pTextarea [name]="'query_' + idx" required
                [title]="'placeholderOptionsJqlQuery' | i18n"
                [placeholder]="'placeholderOptionsJqlQuery' | i18n"
                [(ngModel)]="workspace.query"
                (ngModelChange)="type(workspace)"
                fluid></textarea>

              <button pButton type="button" class="button bg-fg-darkBlue w-10 shrink-0"
                (click)="verify(workspace)">
                <i class="icon-help fg-white" *ngIf="status(workspace) < 0"></i>
                <i class="icon-cancel-2 fg-red" *ngIf="status(workspace) === 0"></i>
                <i class="icon-checkmark fg-green" *ngIf="status(workspace) === 1"></i>
                <i class="icon-clock fg-orange" *ngIf="status(workspace) === 2"></i>
              </button>
            </div>

            <div class="label info"
              *ngIf="workspace.changesNotify && isQueryValidForWatch(workspace.query)">
              <i class="icon-lamp-2"></i>
              <span [innerHTML]="'optionsJqlDateHint' | i18n"></span>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-8 mt-2.5">
            <div class="inline-flex items-center gap-2">
              <p-checkbox
                [name]="'notify_' + idx"
                [inputId]="'notify_' + idx"
                [(ngModel)]="workspace.changesNotify"
                [binary]="true" />
              <label [for]="'notify_' + idx" class="cursor-pointer select-none text-xs">
                {{ 'optionsJqlCheckUpdates' | i18n }}
              </label>
            </div>

            <div class="inline-flex items-center gap-2" *ngIf="workspace.changesNotify">
              <p-checkbox
                [name]="'persistent_' + idx"
                [inputId]="'persistent_' + idx"
                [(ngModel)]="workspace.changesNotifyPersistent"
                [binary]="true" />
              <label [for]="'persistent_' + idx" class="cursor-pointer select-none text-xs">
                {{ 'optionsJqlCheckUpdatesPersistent' | i18n }}
              </label>
            </div>
          </div>
        </div>

        <div class="span2" *ngIf="workspaces.length > 1">
          <p-buttongroup class="button-set">
            <button pButton type="button" severity="secondary" class="w-8 h-8 !p-0"
              [disabled]="idx === 0"
              (click)="move(idx, -1)"><i class="icon-arrow-up"></i></button>
            <button pButton type="button" severity="secondary" class="w-8 h-8 !p-0"
              [disabled]="idx === workspaces.length - 1"
              (click)="move(idx, 1)"><i class="icon-arrow-down"></i></button>
            <button pButton type="button" severity="danger" class="danger w-8 h-8 !p-0"
              (click)="remove(workspace)"><i class="icon-cancel-2"></i></button>
          </p-buttongroup>
        </div>

      </div>
    </div>

    <div class="row mt-3">
      <div class="span11 offset1">
        <button pButton (click)="add()" type="button" severity="success" class="success">
          <i class="icon-plus-2"></i> {{ 'optionsJqlAddOne' | i18n }}
        </button>
      </div>
    </div>

    <p-divider />

    <div class="clearfix">
      <button pButton type="submit" severity="primary" class="button default">{{ 'btnSave' | i18n }}</button>

      <button pButton type="button" severity="info" class="primary place-right"
        *ngIf="accountSelected !== 'ALL'"
        (click)="import()" [disabled]="importingFavorites">
        <i class="icon-spin"></i> {{ 'optionsJqlImportFavorites' | i18n }}
      </button>
    </div>
  </form>

</div>
