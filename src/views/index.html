<div class="info-bar" *ngIf="!issues.length && !loading && !jiraRequestFailed">
  <h3 class="fg-darkCobalt">{{ 'indexNoDataProvidedTitle' | i18n }}</h3>
  <p>{{ 'indexNoDataProvidedText' | i18n }}</p>
</div>

<div class="error-bar" *ngIf="jiraRequestFailed">
  <h3 class="fg-white">{{ jiraRequestFailed[0] }}</h3>
  <p class="fg-white" [innerHTML]="jiraRequestFailed[1]"></p>
</div>

<div id="loading" *ngIf="loading">
  <p-progressspinner strokeWidth="4" [style]="{ width: '42px', height: '42px' }" />
</div>

<div class="container container-widget clearfix">

  <div class="clearfix" id="tiles-toolbar">

    <div id="limit-per-page" *ngIf="!loading">
      <p-select
        [options]="maxResultsOptions"
        [ngModel]="searchMaxResults"
        (ngModelChange)="onMaxResultsChange($event)"
        appendTo="body"
        size="small" />
    </div>

    <div id="account-switch" *ngIf="!loading && accounts.length > 1">
      <p-select
        [options]="sortedAccounts()"
        optionLabel="label"
        [ngModel]="account"
        (ngModelChange)="onAccountChange($event)"
        appendTo="body"
        size="small"
        fluid />
    </div>

    <div id="home-workspaces" *ngIf="!loading">
      <p-buttongroup *ngIf="workspaces.length >= 2">
        <button pButton type="button" size="small"
          *ngFor="let workspace of workspaces; let i = index"
          [title]="workspace.title || ''"
          (click)="workspaceSwitchTo(i)"
          [severity]="workspace === workspaceActive ? 'primary' : 'secondary'"
          [ngClass]="{default: workspace === workspaceActive}">
          <i class="icon-{{ workspace.icon }}"></i>
        </button>
      </p-buttongroup>

      <div class="input-control text size3" id="filter" *ngIf="filterFieldDisplay">
        <input #filterInput pInputText pSize="small" type="text" [(ngModel)]="filterText" class="bd-darkBlue" fluid>
      </div>

      <button pButton type="button" size="small"
        [title]="'indexTooltipFilters' | i18n"
        (click)="toggleFilterField()"
        [severity]="(filterFieldDisplay || filterText) ? 'contrast' : 'secondary'"
        [ngClass]="{inverse: filterFieldDisplay || filterText}">
        <i class="icon-filter"></i>
      </button>

      <button pButton type="button" size="small"
        [title]="'indexTooltipTools' | i18n"
        id="advanced-panel-icon"
        [severity]="homePanelVisible ? 'contrast' : 'secondary'"
        [ngClass]="{inverse: homePanelVisible}"
        (click)="toggleHomePanel()">
        <i class="icon-mouse"></i>
      </button>
    </div>

  </div>

  <div id="advanced-panel" *ngIf="!loading && homePanelVisible">
    <button pButton type="button" size="small" severity="secondary" [title]="'indexTooltipRefresh' | i18n" (click)="workspaceRefresh()">
      <i class="icon-spin"></i>
    </button>

    <button pButton type="button" size="small" severity="secondary" [title]="'indexTooltipDetachWindow' | i18n"
      *ngIf="!windowDetached"
      (click)="windowDetach()">
      <i class="icon-new-tab-2"></i>
    </button>

    <button pButton type="button" size="small" severity="secondary" [title]="'indexTooltipSettings' | i18n" (click)="tabSettings()">
      <i class="icon-tools"></i>
    </button>

    <button pButton type="button" size="small" severity="secondary" [title]="'optionsAboutFeedback' | i18n" (click)="tabFeedback()">
      <i class="icon-mail"></i>
    </button>
  </div>

  <div class="tiles clearfix" *ngIf="!loading">
    <h3 *ngIf="issues.length">{{ workspaceActive.title }}</h3>

    <tile
      *ngFor="let issue of filteredIssues()"
      [entry]="issue"
      [timer]="timer"
      [api]="api"
      [account]="account"
      [toolbarOpen]="openToolbarIssueId === issue.id"
      (selectTile)="onTileClick($event, issue)"
      (openIssue)="tabIssue($event)"
      (modified)="onTileModified($event)"></tile>

    <pagination
      [position]="searchStartAt"
      [limit]="searchMaxResults"
      [total]="searchTotal"
      [callback]="refreshCallback"></pagination>
  </div>

</div>
