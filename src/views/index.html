<div class="info-bar" *ngIf="!issues.length && !loading">
  <h3 class="fg-darkCobalt">{{ 'indexNoDataProvidedTitle' | i18n }}</h3>
  <p>{{ 'indexNoDataProvidedText' | i18n }}</p>
</div>

<div class="error-bar" *ngIf="jiraRequestFailed">
  <h3 class="fg-white">{{ jiraRequestFailed[0] }}</h3>
  <p class="fg-white" [innerHTML]="jiraRequestFailed[1]"></p>
</div>

<div id="loading" *ngIf="loading"><i class="icon-clock"></i></div>

<div class="container container-widget clearfix">

  <div class="clearfix" id="tiles-toolbar">

    <div id="limit-per-page" class="input-control select" *ngIf="!loading">
      <select [ngModel]="searchMaxResults" (ngModelChange)="onMaxResultsChange($event)">
        <option [ngValue]="8">8</option>
        <option [ngValue]="16">16</option>
        <option [ngValue]="25">25</option>
        <option [ngValue]="50">50</option>
        <option [ngValue]="75">75</option>
        <option [ngValue]="100">100</option>
        <option [ngValue]="150">150</option>
        <option [ngValue]="250">250</option>
      </select>
    </div>

    <div id="account-switch" class="input-control select" *ngIf="!loading && accounts.length > 1">
      <select [ngModel]="account" (ngModelChange)="onAccountChange($event)">
        <option *ngFor="let item of sortedAccounts()" [ngValue]="item">{{ item.label }}</option>
      </select>
    </div>

    <div id="home-workspaces"
      *ngIf="workspaces.length >= 2 && !loading">
      <button type="button"
        *ngFor="let workspace of workspaces; let i = index"
        [title]="workspace.title || ''"
        (click)="workspaceSwitchTo(i)"
        [ngClass]="{default: workspace === workspaceActive}">
        <i class="icon-{{ workspace.icon }}"></i>
      </button>

      <div class="input-control text size3" id="filter"
        *ngIf="filterFieldDisplay">
        <input #filterInput type="text" [(ngModel)]="filterText" class="bd-darkBlue">
      </div>

      <button type="button" [title]="'indexTooltipFilters' | i18n"
        (click)="toggleFilterField()"
        [ngClass]="{inverse: filterFieldDisplay || filterText}">
        <i class="icon-filter"></i>
      </button><!--

    --><button type="button" [title]="'indexTooltipTools' | i18n" id="advanced-panel-icon"
        [ngClass]="{inverse: homePanelVisible}"
        (click)="homePanelVisible = !homePanelVisible">
        <i class="icon-mouse"></i>
      </button>
    </div>

  </div>

  <div id="advanced-panel"
    *ngIf="!loading && homePanelVisible">
    <button type="button" [title]="'indexTooltipRefresh' | i18n" (click)="workspaceRefresh()">
      <i class="icon-spin"></i>
    </button>

    <button type="button" [title]="'indexTooltipDetachWindow' | i18n"
      *ngIf="!windowDetached"
      (click)="windowDetach()">
      <i class="icon-new-tab-2"></i>
    </button>

    <button type="button" [title]="'indexTooltipSettings' | i18n" (click)="tabSettings()">
      <i class="icon-tools"></i>
    </button>

    <button type="button" [title]="'optionsAboutFeedback' | i18n" (click)="tabFeedback()">
      <i class="icon-mail"></i>
    </button>
  </div>

  <div class="tiles clearfix" *ngIf="!loading">
    <h3 *ngIf="issues.length">{{ workspaceActive.title }}</h3>

    <tile
      *ngFor="let issue of filteredIssues()"
      [entry]="issue"
      [timer]="timer"
      [api]="api"
      [account]="account"
      [toolbarOpen]="openToolbarIssueId === issue.id"
      (selectTile)="onTileClick($event, issue)"
      (openIssue)="tabIssue($event)"
      (modified)="onTileModified($event)"></tile>

    <pagination
      [position]="searchStartAt"
      [limit]="searchMaxResults"
      [total]="searchTotal"
      [callback]="refreshCallback"></pagination>
  </div>

</div>
