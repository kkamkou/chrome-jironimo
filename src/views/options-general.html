<div class="container container-options bg-white padding20">

  <navigation current="general"></navigation>

  <h1>
    Jironimo
    <small>{{ 'optionsGeneralTitle' | i18n }}</small>
  </h1>

  <form (ngSubmit)="save()" ngNativeValidate class="grid mb-0">
    <div class="row items-center">
      <div class="span1 flex items-center">
        <p-toggleswitch
          name="accountEnabled"
          [(ngModel)]="accountSelected.enabled"
          [class.switch-disabled]="!accountSelected.enabled"
          title="Enable this account" />
      </div>

      <div class="span8">
        <p-select
          name="accountSelected"
          [options]="accountList"
          optionLabel="label"
          [ngModel]="accountSelected"
          (ngModelChange)="onAccountSelect($event)"
          [styleClass]="accountSelected.enabled ? 'bg-white' : 'bg-crimson fg-white'"
          appendTo="body"
          fluid />
      </div>

      <div class="span3">
        <p-buttongroup class="button-set">
          <button pButton type="button" severity="secondary"
            *ngIf="accountList.length < 10"
            (click)="accountAdd()"><i class="icon-plus-2 on-left"></i> Add</button>
          <button pButton type="button" severity="danger" class="danger"
            *ngIf="accountList.length > 1"
            (click)="accountRemoveSelected()"><i class="icon-cancel-2 on-left"></i> Delete</button>
        </p-buttongroup>
      </div>
    </div>

    <div class="row">
      <div class="span6">
        <h2>{{ 'captionOptionsAccountJiraAddress' | i18n }}</h2>

        <p-inputgroup class="mb-3">
          <input pInputText type="url" name="accountUrl" required="required"
            [(ngModel)]="accountSelected.url"
            [title]="'placeholderOptionsAccountUrl' | i18n"
            [placeholder]="'placeholderOptionsAccountUrl' | i18n"
            fluid>

          <button pButton type="button" class="button bg-fg-darkBlue w-10 shrink-0"
            [title]="'placeholderOptionsAccountAuthVerify' | i18n"
            (click)="accountAuthVerify(accountSelected.url, accountSelected.timeout)">
            <i class="icon-help fg-white" *ngIf="accountSelectedAuthStatus < 0"></i>
            <i class="icon-link-2 fg-red" *ngIf="accountSelectedAuthStatus === 0"></i>
            <i class="icon-link fg-green" *ngIf="accountSelectedAuthStatus === 1"></i>
            <i class="icon-clock fg-orange" *ngIf="accountSelectedAuthStatus === 2"></i>
          </button>
        </p-inputgroup>

        <div class="input-control text">
          <input pInputText type="number" name="accountTimeout" min="5" max="60" maxlength="2" required="required"
            [(ngModel)]="accountSelected.timeout"
            [title]="'placeholderOptionsAccountTimeout' | i18n"
            [placeholder]="'placeholderOptionsAccountTimeout' | i18n"
            fluid>
        </div>
      </div>

      <div class="span6 self-center">
        <div class="notice marker-on-left bg-white"
          [innerHTML]="'hintWhereToFindJiraAddress' | i18n"></div>
      </div>
    </div>

    <p-divider />

    <div class="row bg-[#fbfbfb] py-3 px-4 border border-neutral-100">
      <div class="span6">
        <h2>{{ 'captionOptionsAccountSync' | i18n }}</h2>

        <div class="my-1.5">
          <p-toggleswitch name="generalSync" [(ngModel)]="general.sync" />
        </div>

        <blockquote>
          <p [innerHTML]="'hintSynchroniseSettings' | i18n"></p>
        </blockquote>
      </div>

      <div class="span6 self-center">
        <div class="notice marker-on-left bg-white">
          <p [innerHTML]="'hintHowDataIsStored' | i18n"></p>
          <p [innerHTML]="'hintRequiredJiraAgile' | i18n"></p>
        </div>
      </div>
    </div>

    <p-divider />

    <div>
      <button pButton type="submit" severity="primary" class="button default">{{ 'btnSave' | i18n }}</button>
    </div>
  </form>

</div>
