<div class="tile padding10 {{ entry._size }} bg-{{ entry._colors.bg }} border-{{ entry._colors.bd }} outline-{{ entry._colors.ot }}"
  [ngClass]="{selected: entry._isClosed}"
  (click)="selectTile.emit($event)"
  (dblclick)="openIssue.emit(entry)">

  <div class="issue-icon issue-icon-status bg-{{ entry._colors.bd }}"
    [title]="entry.fields.status.name"
    *ngIf="entry.fields.status.iconUrl && entry.fields.status.iconUrl.indexOf('.') !== -1">
    <img [src]="entry.fields.status.iconUrl" alt=""></div>

  <div class="tile-content">
    <h5 class="fg-{{ entry._colors.fg }}">{{ entry.key }}</h5>
    <h6 class="fg-{{ entry._colors.fg }}">{{ entry.fields.reporter?.displayName || '' }}</h6>
    <p class="fg-{{ entry._colors.fg }}">{{ entry.fields.summary }}</p>
  </div>

  <div class="brand">
    <span class="name fg-{{ entry._colors.fg }}" *ngIf="!timer.isStarted(entry)">
      <sup *ngIf="entry.fields.timeestimate">{{ entry.fields.timeestimate }}</sup>
      {{ entry.fields.issuetype.name }}
    </span>
    <span class="name" *ngIf="timer.canBeStopped(entry)">{{ timer.elapsedTime(entry) }}</span>
    <span class="badge bg-lightRed" *ngIf="timer.isStarted(entry)"><i class="icon-play"></i></span>
  </div>

  <tile-progress
    *ngIf="(entry.fields.progress?.percent || 0) > 0"
    [percent]="entry.fields.progress?.percent || 0"
    [colorBg]="entry._colors.bg"></tile-progress>

  <tile-toolbar
    [account]="account"
    [api]="api"
    [entry]="entry"
    [timer]="timer"
    [visible]="toolbarOpen"
    (showTransitions)="transitionsOpen = true"
    (openIssue)="openIssue.emit($event)"
    (modified)="modified.emit($event)"></tile-toolbar>

  <tile-transitions
    [api]="api"
    [entry]="entry"
    [visible]="transitionsOpen"
    (closed)="transitionsOpen = false"
    (modified)="modified.emit($event)"></tile-transitions>
</div>
