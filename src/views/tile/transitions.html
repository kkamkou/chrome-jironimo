<div class="transitions bg-darker" [style.display]="visible ? 'block' : 'none'" (click)="$event.stopPropagation()">
  <a href="#" (click)="close($event)" class="bg-orange fg-white close">&times;</a>

  <div class="padding10">
    <div *ngFor="let transition of entry.transitions">
      <a href="#" class="fg-orange"
        (click)="modify($event, entry, transition)"><small>{{ transition.name }}</small></a>
    </div>
  </div>
</div>
