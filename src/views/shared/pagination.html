<div id="pagination" class="pagination">
  <ul *ngIf="limit < total">
    <li class="first" *ngIf="hasPrev()"><a (click)="first()"><i class="icon-first-2"></i></a></li>
    <li class="prev" *ngIf="hasPrev()"><a (click)="prev()"><i class="icon-previous"></i></a></li>
    <li class="active"><a>{{ 'paginationPosition' | i18n: [position, hasNext() ? (position + limit) : total, total] }}</a></li>
    <li class="next" *ngIf="hasNext()"><a (click)="next()"><i class="icon-next"></i></a></li>
    <li class="last" *ngIf="hasNext()"><a (click)="last()"><i class="icon-last-2"></i></a></li>
  </ul>
</div>
