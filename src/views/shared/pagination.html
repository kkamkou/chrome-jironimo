<div id="pagination" class="pagination" *ngIf="limit < total">
  <p-buttongroup>
    <button pButton type="button" size="small" severity="secondary" *ngIf="hasPrev()" (click)="first()">
      <i class="icon-first-2"></i>
    </button>
    <button pButton type="button" size="small" severity="secondary" *ngIf="hasPrev()" (click)="prev()">
      <i class="icon-previous"></i>
    </button>
    <button pButton type="button" size="small" severity="primary" class="pointer-events-none">
      {{ 'paginationPosition' | i18n: [position, hasNext() ? (position + limit) : total, total] }}
    </button>
    <button pButton type="button" size="small" severity="secondary" *ngIf="hasNext()" (click)="next()">
      <i class="icon-next"></i>
    </button>
    <button pButton type="button" size="small" severity="secondary" *ngIf="hasNext()" (click)="last()">
      <i class="icon-last-2"></i>
    </button>
  </p-buttongroup>
</div>
