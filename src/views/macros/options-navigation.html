<div class="toolbar place-right">
  <p-buttongroup>
    <button pButton *ngFor="let entry of entries"
      type="button"
      [severity]="entry.id === current ? 'primary' : 'secondary'"
      [title]="entry.title | i18n"
      (click)="goTo(entry)"
      [disabled]="entry.id === current">
      <i class="icon-{{ entry.icon }}"></i>
    </button>
    <a pButton severity="success"
      href="https://github.com/kkamkou/chrome-jironimo/issues"
      title="Help us to improve it!" target="_blank">
      <i class="icon-github"></i>
    </a>
  </p-buttongroup>
</div>
