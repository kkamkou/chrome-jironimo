<div class="container container-options bg-white padding20">

  <navigation current="timer"></navigation>

  <h1>
    Jironimo
    <small>{{ 'optionsTimerTitle' | i18n }}</small>
  </h1>

  <form (ngSubmit)="save('timer', timer)" ngNativeValidate class="mb-0">
    <h2>{{ 'optionsTimerWorkspaces' | i18n }}</h2>
    <div class="span6 mb-4">
      <input pInputText type="number" name="timerWorkspace" min="1" max="60" maxlength="2" required
        [title]="'placeholderOptionsTimerRefreshInterval' | i18n"
        [placeholder]="'placeholderOptionsTimerRefreshInterval' | i18n"
        [(ngModel)]="timer.workspace"
        fluid>
    </div>

    <h2>{{ 'optionsTimerTimelog' | i18n }}</h2>
    <div class="grid">
      <div class="row items-center">
        <div class="span6 inline-flex items-center gap-2.5">
          <p-toggleswitch name="timerEnabled" inputId="timerEnabled" [(ngModel)]="timer.enabled" />
          <label for="timerEnabled" class="cursor-pointer select-none">{{ 'optionsTimerEnableTimelog' | i18n }}</label>
        </div>

        <div class="span6 inline-flex items-center gap-2.5" *ngIf="timer.enabled">
          <p-toggleswitch name="timerSingleton" inputId="timerSingleton" [(ngModel)]="timer.singleton" />
          <label for="timerSingleton" class="cursor-pointer select-none">{{ 'optionsTimerTimelogOnlyOneActive' | i18n }}</label>
        </div>
      </div>
    </div>

    <p-divider />

    <button pButton type="submit" severity="primary" class="button default">{{ 'btnSave' | i18n }}</button>
  </form>

</div>
